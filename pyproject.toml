[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-patterns"
version = "0.1.0"
description = "Candlestick pattern generators and Yahoo Finance training pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "yfinance>=0.2.40",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
  "matplotlib>=3.8.0",
  "tqdm>=4.66.0",
]

[project.scripts]
sp-generate = "stock_patterns.scripts.generate_synthetic:main"
sp-fetch = "stock_patterns.scripts.fetch_ticker:main"
sp-train = "stock_patterns.scripts.train:main"
sp-detect = "stock_patterns.scripts.detect:main"

[tool.setuptools.packages.find]
include = ["stock_patterns*"]
